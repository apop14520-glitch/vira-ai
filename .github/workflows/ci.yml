name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Run pytest
        working-directory: apps/api
        run: python -m pytest tests

  web-tests:
    name: Web tests, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        run: npm install
      - name: Typecheck
        run: npm --workspace @vira-ai/web run typecheck
      - name: Run vitest
        run: npm --workspace @vira-ai/web run test
      - name: Build
        run: npm --workspace @vira-ai/web run build
